<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administratora</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  padding:20px;
  max-width:700px;
  margin:auto
}
input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  box-sizing:border-box
}
button{
  width:100%;
  padding:12px;
  background:#111;
  color:#fff;
  border:0;
  border-radius:8px;
  cursor:pointer
}
#preview{
  max-width:250px;
  max-height:250px;
  display:none;
  margin:10px auto;
  object-fit:contain
}
#msg{
  text-align:center;
  font-weight:bold
}
</style>
</head>

<body>

<h2>Panel administratora</h2>

<input id="name" placeholder="Nazwa">
<input id="price" placeholder="Cena">
<input id="size" placeholder="Rozmiar">

<input id="imageFile" type="file" accept="image/*">
<img id="preview">

<select id="platform">
  <option>Vinted</option>
  <option>OLX</option>
  <option>Allegro</option>
</select>

<input id="link" placeholder="Link do ogłoszenia">

<button id="add">Dodaj produkt</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import { firebaseConfig } from "./firebase.js";


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const email = prompt("Email administratora");
const pass = prompt("Hasło administratora");

await signInWithEmailAndPassword(auth,email,pass);


const imageFile = document.getElementById("imageFile");
const preview = document.getElementById("preview");
const msg = document.getElementById("msg");


let imageData = "";


/* Podgląd zdjęcia */

imageFile.addEventListener("change", () => {

  const file = imageFile.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    imageData = reader.result;

    preview.src = imageData;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* Dodawanie produktu */

document.getElementById("add").onclick = async () => {

  try {

    if (!imageData) {
      msg.textContent = "Wybierz zdjęcie.";
      return;
    }

    if (!name.value || !price.value || !size.value || !link.value) {
      msg.textContent = "Uzupełnij wszystkie pola.";
      return;
    }

    msg.textContent = "Dodawanie produktu...";


    await addDoc(collection(db,"products"), {

      name: name.value,
      price: price.value,
      size: size.value,
      image: imageData,
      platform: platform.value,
      link: link.value

    });


    msg.textContent = "✅ Produkt dodany!";

    name.value = "";
    price.value = "";
    size.value = "";
    link.value = "";

    imageFile.value = "";
    imageData = "";

    preview.src = "";
    preview.style.display = "none";


  } catch(error) {

    console.error(error);

    msg.textContent = "❌ Błąd: " + error.message;

  }

};

</script>

</body>
</html>
