<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administratora</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  padding:20px;
  max-width:700px;
  margin:auto
}

h2{
  text-align:center;
  margin-bottom:25px
}

input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px
}

button{
  width:100%;
  padding:13px;
  background:#111;
  color:#fff;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  margin-top:8px
}

button:disabled{
  background:#999;
  cursor:not-allowed
}

#preview{
  max-width:250px;
  max-height:250px;
  display:none;
  margin:15px auto;
  object-fit:contain;
  border-radius:10px
}

#msg{
  text-align:center;
  font-weight:bold;
  margin-top:15px
}

#adminPanel{
  display:none
}

.box{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:20px
}
</style>
</head>

<body>

<h2>Panel administratora</h2>

<div class="box" id="loginPanel">

  <input id="email" type="email" placeholder="Email administratora">

  <input id="password" type="password" placeholder="Hasło administratora">

  <button id="login">Zaloguj się</button>

  <p id="loginMsg"></p>

</div>


<div class="box" id="adminPanel">

  <input id="name" placeholder="Nazwa produktu">

  <input id="price" placeholder="Cena">

  <input id="size" placeholder="Rozmiar">

  <input id="imageFile" type="file" accept="image/*">

  <img id="preview">

  <select id="platform">
    <option>Vinted</option>
    <option>OLX</option>
    <option>Allegro</option>
  </select>

  <input id="link" placeholder="Link do ogłoszenia">

  <button id="add">Dodaj produkt</button>

  <p id="msg"></p>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  addDoc,
  collection
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import { firebaseConfig } from "./firebase.js";


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");

const email = document.getElementById("email");
const password = document.getElementById("password");

const loginButton = document.getElementById("login");
const loginMsg = document.getElementById("loginMsg");


/* LOGOWANIE */

loginButton.onclick = async () => {

  try {

    loginMsg.textContent = "Logowanie...";

    await signInWithEmailAndPassword(
      auth,
      email.value.trim(),
      password.value
    );

    loginMsg.textContent = "✅ Zalogowano";

    loginPanel.style.display = "none";
    adminPanel.style.display = "block";

  } catch(error) {

    console.error(error);

    loginMsg.textContent =
      "❌ Błędny email lub hasło.";

  }

};


/* ELEMENTY FORMULARZA */

const imageFile = document.getElementById("imageFile");
const preview = document.getElementById("preview");
const msg = document.getElementById("msg");
const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const sizeInput = document.getElementById("size");
const platformInput = document.getElementById("platform");
const linkInput = document.getElementById("link");
let imageData = "";


/* WYBÓR ZDJĘCIA */

imageFile.addEventListener("change", () => {

  const file = imageFile.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    imageData = reader.result;

    preview.src = imageData;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* DODAWANIE PRODUKTU */

document.getElementById("add").onclick = async () => {

  try {

    if (!auth.currentUser) {

      msg.textContent = "❌ Najpierw się zaloguj.";

      return;

    }

    if (!imageData) {

      msg.textContent = "❌ Wybierz zdjęcie.";

      return;

    }

    if (
      !name.value.trim() ||
      !price.value.trim() ||
      !size.value.trim() ||
      !link.value.trim()
    ) {

      msg.textContent =
        "❌ Uzupełnij wszystkie pola.";

      return;

    }

    msg.textContent = "Dodawanie produktu...";


    await addDoc(
      collection(db,"products"),
      {

        name: name.value.trim(),

        price: price.value.trim(),

        size: size.value.trim(),

        image: imageData,

        platform: platform.value,

        link: link.value.trim()

      }
    );


    msg.textContent =
      "✅ Produkt został dodany!";


    name.value = "";
    price.value = "";
    size.value = "";
    link.value = "";

    imageFile.value = "";

    imageData = "";

    preview.src = "";

    preview.style.display = "none";


  } catch(error) {

    console.error(error);

    msg.textContent =
      "❌ Błąd: " + error.message;

  }

};

</script>

</body>
</html>
