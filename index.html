<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXY SNEAKERS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(125,0,255,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(0,180,255,.15),transparent 30%),
    #08080d;
  color:white;
}


/* NAGŁÓWEK */

header{
  background:linear-gradient(90deg,#09090d,#16002c,#09090d);
  border-bottom:1px solid rgba(170,70,255,.35);
  padding:22px 20px;
  text-align:center;
  position:relative;
}

header h1{
  margin:0;
  font-size:34px;
  letter-spacing:3px;
  background:linear-gradient(90deg,#fff,#b44cff,#4fc3ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header p{
  margin:8px 0 0;
  color:#bdb5ca;
  font-size:14px;
}


/* BANER */

.hero{
  max-width:1200px;
  margin:30px auto 10px;
  padding:45px 35px;
  border-radius:24px;
  background:
    linear-gradient(120deg,
      rgba(12,12,20,.98),
      rgba(55,0,100,.9),
      rgba(0,70,110,.8)
    );
  border:1px solid rgba(170,70,255,.4);
  box-shadow:
    0 0 40px rgba(130,0,255,.15),
    inset 0 0 50px rgba(0,180,255,.05);
  overflow:hidden;
}

.hero h2{
  margin:0;
  font-size:42px;
  line-height:1.05;
}

.hero h2 span{
  background:linear-gradient(90deg,#a83cff,#36cfff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  color:#d4cce0;
  font-size:17px;
  margin:18px 0 0;
}


/* KATEGORIE */

.categories{
  max-width:1200px;
  margin:25px auto 5px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.category{
  background:linear-gradient(145deg,#15151d,#101018);
  border:1px solid #29293a;
  border-radius:16px;
  padding:20px;
  text-align:center;
  font-weight:bold;
  transition:.2s;
}

.category:hover{
  transform:translateY(-4px);
  border-color:#a83cff;
  box-shadow:0 0 20px rgba(168,60,255,.2);
}

.category .icon{
  font-size:28px;
  display:block;
  margin-bottom:8px;
}


/* TYTUŁ */

.section-title{
  max-width:1200px;
  margin:auto;
  text-align:left;
  padding:35px 20px 10px;
}

.section-title h2{
  margin:0;
  font-size:30px;
}

.section-title h2 span{
  color:#a83cff;
}

.section-title p{
  color:#9d96a8;
  margin:8px 0 0;
}


/* PRODUKTY */

.grid{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 60px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}


/* KARTA */

.card{
  position:relative;
  background:linear-gradient(145deg,#15151d,#0e0e14);
  border:1px solid #29293a;
  border-radius:18px;
  padding:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  transition:.25s;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#9d3cff;
  box-shadow:
    0 12px 35px rgba(0,0,0,.5),
    0 0 25px rgba(140,40,255,.16);
}


/* ZDJĘCIE */

.card img{
  width:100%;
  height:270px;
  object-fit:contain;
  display:block;
  border-radius:13px;
  background:#f7f7f7;
}


/* INFORMACJE */

.card h3{
  font-size:18px;
  margin:16px 5px 8px;
  color:#fff;
}

.price{
  font-size:24px;
  font-weight:bold;
  margin:0 5px 8px;
  color:#b44cff;
}

.size{
  color:#aaa4b4;
  margin:0 5px 15px;
}


/* PRZYCISK */

.btn{
  display:block;
  background:linear-gradient(90deg,#8d2cff,#4b8dff);
  color:white;
  text-align:center;
  padding:13px;
  border-radius:11px;
  text-decoration:none;
  font-weight:bold;
  border:1px solid rgba(255,255,255,.15);
  transition:.2s;
  box-shadow:0 4px 15px rgba(100,40,255,.25);
}

.btn:hover{
  transform:scale(1.02);
  background:linear-gradient(90deg,#a83cff,#36cfff);
  box-shadow:0 5px 22px rgba(120,60,255,.4);
}


/* STOPKA */

footer{
  background:#07070b;
  border-top:1px solid #29293a;
  color:#888;
  text-align:center;
  padding:30px 15px;
  font-size:13px;
}

footer strong{
  color:#b44cff;
}


/* TELEFON */

@media(max-width:700px){

  header{
    padding:22px 15px;
  }

  header h1{
    font-size:28px;
  }

  .hero{
    margin:18px 15px 5px;
    padding:30px 22px;
    border-radius:18px;
  }

  .hero h2{
    font-size:30px;
  }

  .hero p{
    font-size:15px;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
    padding:0 15px;
  }

  .category{
    padding:16px 10px;
  }

  .section-title{
    padding:30px 15px 5px;
  }

  .section-title h2{
    font-size:25px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:20px 15px 45px;
  }

  .card img{
    height:280px;
  }

}

</style>
</head>


<body>


<header>

  <h1>FIXY SNEAKERS</h1>

  <p>SNEAKERS • STREETWEAR • STYLE</p>

</header>


<section class="hero">

  <h2>
    Twoje ulubione sneakersy
    <br>
    <span>w jednym miejscu!</span>
  </h2>

  <p>
    Znajdź swoją kolejną parę i sprawdź dostępne oferty.
  </p>

</section>


<div class="categories">

  <div class="category">
    <span class="icon">👟</span>
    Buty
  </div>

  <div class="category">
    <span class="icon">👕</span>
    Ubrania
  </div>

  <div class="category">
    <span class="icon">🧥</span>
    Bluzy
  </div>

  <div class="category">
    <span class="icon">🧢</span>
    Akcesoria
  </div>

</div>


<div class="section-title">

  <h2>
    🔥 <span>Aktualne</span> oferty
  </h2>

  <p>
    Sprawdź dostępne produkty
  </p>

</div>


<div id="grid" class="grid"></div>


<footer>

  © 2026 <strong>FIXY SNEAKERS</strong>
  <br><br>
  Sneakers • Streetwear • Style

</footer>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import { firebaseConfig }
from "./firebase.js";


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const grid = document.getElementById("grid");


const snap = await getDocs(
  collection(db,"products")
);


snap.forEach(doc => {

  const p = doc.data();


  grid.innerHTML += `

    <div class="card">

      <img
        src="${p.image}"
        alt="${p.name}"
      >

      <h3>
        ${p.name}
      </h3>

      <p class="price">
        ${p.price}
      </p>

      <p class="size">
        Rozmiar: ${p.size}
      </p>

      <a
        class="btn"
        href="${p.link}"
        target="_blank"
        rel="noopener"
      >
        KUP TERAZ NA OLX
      </a>

    </div>

  `;

});

</script>


</body>
</html>
